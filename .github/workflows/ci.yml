name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit + integration test suite (election, replication, partition tolerance, crash/restart, KV layer)
        run: go test ./... -timeout 120s -v

      - name: Same suite under the race detector, repeated to shake out timing-dependent bugs
        run: go test ./... -race -count=5 -timeout 300s

      - name: Build the real deployment binaries (kvserver, kvctl)
        run: |
          go build -o /tmp/kvserver ./cmd/kvserver
          go build -o /tmp/kvctl ./cmd/kvctl

      - name: Live 3-process cluster smoke test over real HTTP (leader election, writes, crash + failover)
        run: |
          set -e

          diag_fail() {
            msg="$1"
            dump=$(for f in /tmp/kvci/node*.log; do echo "--- $f ---"; cat "$f"; done 2>/dev/null | tr '\n' ' ' | sed 's/%/percent/g')
            echo "::error::${msg} | logs: ${dump}"
            exit 1
          }

          # Polls every node's /status until one reports itself leader (or
          # we give up). A single check right after startup is flaky on a
          # loaded CI runner where process start + first election can
          # together take longer than on a quiet dev machine.
          wait_for_leader() {
            for attempt in $(seq 1 30); do
              LEADER=-1
              for i in 0 1 2; do
                resp=$(curl -s --max-time 1 "http://127.0.0.1:$((19100+i))/status" || true)
                if echo "$resp" | grep -q '"leader":true'; then LEADER=$i; fi
              done
              if [ "$LEADER" != "-1" ]; then return 0; fi
              sleep 0.3
            done
            return 1
          }

          PEERS="0=127.0.0.1:19100,1=127.0.0.1:19101,2=127.0.0.1:19102"
          PC="127.0.0.1:19100,127.0.0.1:19101,127.0.0.1:19102"
          mkdir -p /tmp/kvci
          for i in 0 1 2; do
            mkdir -p /tmp/kvci/data$i
            /tmp/kvserver -id $i -peers "$PEERS" -datadir /tmp/kvci/data$i > /tmp/kvci/node$i.log 2>&1 &
            echo $! >> /tmp/kvci/pids
          done

          wait_for_leader || diag_fail "no leader elected after cluster startup"
          echo "initial leader: node $LEADER"

          /tmp/kvctl -peers "$PC" put foo bar || diag_fail "initial put foo=bar failed"
          [ "$(/tmp/kvctl -peers "$PC" get foo)" = "bar" ] || diag_fail "get foo did not return bar"

          LPID=$(sed -n "$((LEADER+1))p" /tmp/kvci/pids)
          echo "killing leader node $LEADER (pid $LPID)"
          kill -9 "$LPID"

          wait_for_leader || diag_fail "no new leader elected after killing node $LEADER"
          echo "new leader after crash: node $LEADER"

          # Retry: right after a failover, the very next write can race the
          # new leader still catching up its own commit check, so a single
          # kvctl attempt isn't guaranteed to land instantly.
          ok=""
          for attempt in $(seq 1 10); do
            if /tmp/kvctl -peers "$PC" put after_crash still_works; then ok=1; break; fi
            sleep 0.3
          done
          [ -n "$ok" ] || diag_fail "put after_crash never succeeded against the new leader"

          [ "$(/tmp/kvctl -peers "$PC" get after_crash)" = "still_works" ] || diag_fail "get after_crash did not return still_works"
          [ "$(/tmp/kvctl -peers "$PC" get foo)" = "bar" ] || diag_fail "pre-crash key foo was lost after failover"

          echo "cluster survived a real leader crash and kept serving writes"
          pkill -9 -f /tmp/kvserver || true
